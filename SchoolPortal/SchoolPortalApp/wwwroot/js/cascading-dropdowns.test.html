<!DOCTYPE html>
<html>
<head>
    <title>Cascading Dropdowns Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Cascading Dropdowns Test</h2>
        
        <form>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="CountryId" class="form-label">Country</label>
                    <select id="CountryId" class="form-select" data-states-target="StateId" data-cities-target="CityId" data-controller="Test">
                        <option value="">-- Select Country --</option>
                        <option value="1">USA</option>
                        <option value="2">Canada</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="StateId" class="form-label">State</label>
                    <select id="StateId" class="form-select">
                        <option value="">-- Select State --</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="CityId" class="form-label">City</label>
                    <select id="CityId" class="form-select">
                        <option value="">-- Select City --</option>
                    </select>
                </div>
            </div>
        </form>
    </div>

    <script>
        // Mock fetch function for testing
        window.fetch = function(url) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    let data = [];
                    if (url.includes('GetStates')) {
                        data = [
                            { id: '1', name: 'California' },
                            { id: '2', name: 'Texas' }
                        ];
                    } else if (url.includes('GetCities')) {
                        data = [
                            { id: '1', name: 'Los Angeles' },
                            { id: '2', name: 'San Francisco' }
                        ];
                    }
                    resolve({
                        json: () => Promise.resolve(data)
                    });
                }, 500);
            });
        };
    </script>
    
    <script src="../js/cascading-dropdowns.js"></script>
</body>
</html>
